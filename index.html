<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hilton Discoverability – Connected Measurement (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#022F5F; --navy-2:#0D3D70; --sky:#A9DBFF; --sky-soft:#E3F2FF;
  --paper:#FCFCFB; --stone:#EDEDEC; --stone-2:#F5F5F3; --line:#DCDDDA;
  --ink:#1B1B1B; --ink-2:#3A3D42; --muted:#5C6066;
  --up:#1F7A5A; --down:#A8452F;
  --serif:'Lora', Georgia, serif; --sans:'Inter', Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#FCFCFB}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:var(--navy);color:#F7F9FC;padding:28px 20px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.logos{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--navy-2)}
.logo{height:32px;width:auto;max-width:110px;display:block}
.logo-x{color:var(--sky);font-size:16px}
.logo-fallback{font-family:var(--serif);font-weight:600;font-size:20px;color:#F7F9FC;letter-spacing:.5px}
.brand{font-family:var(--serif);font-size:22px;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:13px;color:var(--sky);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-group{font-size:12px;color:#8FB0D3;margin:16px 10px 6px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:#D9E6F5;cursor:pointer;font-size:14px;line-height:1.3}
.nav button:hover{background:var(--navy-2)}
.nav button[aria-current="page"]{background:var(--sky);color:var(--navy);font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:#8FB0D3;line-height:1.5}

.main{padding:28px 40px 56px;max-width:1440px;width:100%}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.title h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;color:var(--ink)}
.title p{color:var(--muted);margin-top:6px;max-width:68ch}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
.filters select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 32px 8px 12px;font-size:14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.synthetic{display:inline-block;margin-top:10px;font-size:12px;color:var(--navy);background:var(--sky-soft);border-radius:999px;padding:3px 10px}

/* insight loop strip */
.loop{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);color:#F7F9FC;border-radius:20px;overflow:hidden;margin-bottom:24px}
.loop div{padding:20px 22px;border-right:1px solid var(--navy-2)}
.loop div:last-child{background:var(--sky);color:var(--navy);border:0}
.loop h3{font-family:var(--serif);font-weight:600;font-size:17px;margin-bottom:6px}
.loop h3 em{font-style:italic;font-weight:400;color:var(--sky);margin-right:6px}
.loop div:last-child h3 em{color:var(--navy)}
.loop p{font-size:14px;line-height:1.5;color:#D9E6F5}
.loop div:last-child p{color:var(--navy)}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:24px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.tile:hover{border-color:var(--navy)}
.tile[aria-pressed="true"]{border:2px solid var(--navy);padding:17px 19px;box-shadow:0 0 0 4px var(--sky-soft)}
.tile .kind{font-size:12px;color:var(--muted)}
.tile .name{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.25;color:var(--ink)}
.tile .val{font-family:var(--serif);font-size:34px;line-height:1.1;color:var(--navy);margin-top:4px}
.tile .val small{font-size:15px;color:var(--muted);font-family:var(--sans)}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:500;white-space:nowrap}
.badge.now{background:#DDF0E6;color:#165C43}
.badge.connect{background:var(--sky-soft);color:var(--navy)}
.badge.scale{background:var(--stone);color:var(--ink-2)}
.tile svg{display:block;width:100%;height:36px;margin-top:4px}

/* panels */
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.panel h2{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.3}
.panel .sub{color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:72ch}
.chart{position:relative;height:300px}
.chart.tall{height:340px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px}
.meta b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.feeds{margin-top:12px;font-size:13px;color:var(--navy);background:var(--sky-soft);border-radius:10px;padding:8px 12px}
.toggle{display:inline-flex;background:var(--stone);border-radius:999px;padding:3px;margin-bottom:12px}
.toggle button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--navy);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--stone)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.conf{display:inline-flex;gap:3px;vertical-align:middle}
.conf i{width:10px;height:10px;border-radius:2px;background:var(--stone)}
.conf i.on{background:var(--navy)}
.legend-ready{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.legend-ready span{display:flex;gap:8px;align-items:center}


/* scorecard + breakdowns */
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--sky-soft)}
.scroll{overflow-x:auto}
.scroll table{min-width:900px}
td svg{display:block;width:110px;height:26px}
.layer{font-size:12px;color:var(--muted)}
.status{font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap}
.status.ok{background:#DDF0E6;color:#165C43}
.status.risk{background:#FFF1D6;color:#7A5200}
.status.behind{background:#F7E1DA;color:#8A3523}
td.src{color:var(--muted);font-size:13px}
td.heat{text-align:right;font-variant-numeric:tabular-nums}
.count{font-size:13px;color:var(--muted)}


/* deep dive */
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--stone-2)}
.dd-btn{border:0;background:none;color:var(--navy);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
dialog.dd{position:fixed;inset:0;margin:auto;height:fit-content;border:0;border-radius:20px;padding:0;width:min(1180px,96vw);max-height:92vh;background:var(--paper);color:var(--ink);box-shadow:0 24px 64px rgba(2,47,95,.35)}
dialog.dd::backdrop{background:rgba(2,47,95,.55)}
.dd-head{background:var(--navy);color:#F7F9FC;padding:22px 28px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start;position:sticky;top:0;z-index:2}
.dd-head h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2}
.dd-head .layer{color:var(--sky)}
.dd-kpis{display:flex;gap:28px;margin-top:12px;flex-wrap:wrap}
.dd-kpis div{font-size:12px;color:#B9CDE3}
.dd-kpis b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:#F7F9FC}
.dd-close{background:var(--sky);color:var(--navy);border:0;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.dd-body{padding:22px 28px 28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dd-body .wide{grid-column:1/-1}
.dd-body .chart{height:260px}
.movers li{list-style:none;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--stone);font-size:14px}
@media (max-width:860px){.dd-body{grid-template-columns:1fr}}


.excerpts{display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff}
.ex.pos{border-left-color:var(--navy)} .ex.neg{border-left-color:#C9775F} .ex.neu{border-left-color:#C9CDD2} .ex.acc{border-left-color:#E0A800}
.ex q{display:block;font-family:var(--serif);font-size:15px;line-height:1.5;quotes:none;margin:4px 0}
.ex .m{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px}
.tag.pos{background:var(--sky-soft);color:var(--navy)} .tag.neg{background:#F7E1DA;color:#8A3523} .tag.neu{background:var(--stone);color:var(--ink-2)} .tag.acc{background:#FFF1D6;color:#7A5200}

/* semantic page map */
.mkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.mkpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.mkpi .kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:500}
.mkpi .big{font-family:var(--serif);font-size:32px;color:var(--navy);line-height:1.15;margin-top:4px}
.mkpi .small{font-size:13px;color:var(--muted);margin-top:10px} .mkpi .warn{font-size:13px;color:var(--down);font-weight:500;margin-top:10px}
details.howto{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:16px}
details.howto summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--navy)}
.howgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.how{background:var(--stone-2);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.how .num{width:32px;height:32px;border-radius:999px;background:var(--navy);color:var(--sky);font-family:var(--serif);font-style:italic;font-size:16px;display:flex;align-items:center;justify-content:center}
.how h4{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3;color:var(--ink)}
.how p{font-size:15px;line-height:1.6;color:var(--ink-2)}
.how .dots{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.how .dots span{display:flex;gap:6px;align-items:center}
.how .dots i{width:12px;height:12px;border-radius:999px;display:inline-block}
details.howto summary{font-size:15px}
.mapwrap{display:grid;grid-template-columns:240px 1fr 280px;gap:16px}
.mapbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mapbar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mapbar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
.clist{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:520px}
.clist input[type=search]{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.citems{overflow:auto;display:flex;flex-direction:column;gap:2px}
.citems label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 2px;cursor:pointer}
.citems label span.n{margin-left:auto;color:var(--muted);font-size:12px}
.citems .sw{width:10px;height:10px;border-radius:999px;flex:none}
.clinks{display:flex;gap:10px;font-size:12px}
.clinks button{border:0;background:none;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:12px}
.mapc{position:relative;height:520px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:grab}
.mapc:active{cursor:grabbing}
.maptools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.maptools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.mdetail{border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px}
.mdetail h3{font-family:var(--serif);font-size:18px;line-height:1.3;color:var(--ink)}
.mdetail .empty{color:var(--muted);text-align:center;margin:auto}
.mlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.mlegend span{display:flex;gap:6px;align-items:center}
.mlegend i{width:10px;height:10px;border-radius:999px;display:inline-block}
.ctag{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap}
th.sort{cursor:pointer} th.sort:hover{color:var(--navy)}
.panel.fs{position:fixed;inset:0;z-index:40;border-radius:0;overflow:auto;margin:0}
.panel.fs .mapc{height:calc(100vh - 150px)}
@media (max-width:1100px){.howgrid{grid-template-columns:1fr 1fr}.mapwrap{grid-template-columns:1fr}.clist{max-height:240px}.mkpis{grid-template-columns:1fr}}

@media (max-width:1100px){.grid2{grid-template-columns:1fr}.loop{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:18px 16px;gap:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav-group,.side-foot{display:none}
  .main{padding:20px 16px 40px}
  .loop{grid-template-columns:1fr}
  .meta{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logos">
      <img src="hilton-logo.svg" alt="Hilton" class="logo" onerror="this.outerHTML='<span class=&quot;logo-fallback&quot;>Hilton</span>'">
    </div>
    <div class="brand">Connected measurement<small>Hilton Global Search &amp; Discoverability</small></div>
    <nav class="nav" aria-label="Dashboard views" id="nav"></nav>
    <p class="side-foot">Mockup for discussion. All figures are synthetic and do not reflect Hilton performance.</p>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title">
        <h1 id="viewTitle"></h1>
        <p id="viewSub"></p>
        <span class="synthetic">Synthetic data</span>
      </div>
      <div class="filters">
        <label>Market<select id="fMarket"></select></label>
        <label>Brand<select id="fBrand"></select></label>
        <label>Quarter<select id="fQuarter"></select></label>
      </div>
    </div>
    <div id="view"></div>
    <dialog class="dd" id="dd" aria-label="Measure deep dive"></dialog>
  </main>
</div>

<script>
/* ---------- synthetic data engine ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MARKETS={Global:1,'United States':.42,'United Kingdom':.09,Germany:.06,'United Arab Emirates':.04,Japan:.05,China:.07,Australia:.04};
const REGIONAL=['Japan','China','Australia','United Arab Emirates','Germany','United Kingdom'];
const BRANDS={'All brands':1,'Hilton Hotels & Resorts':.38,'Waldorf Astoria':.05,'Conrad':.07,'DoubleTree':.2,'Hampton':.3};
const QUARTERS=['Q4 2024','Q1 2025','Q2 2025','Q3 2025','Q4 2025','Q1 2026','Q2 2026','Q3 2026'];
const ADR=212;
const S={market:'Global',brand:'All brands',q:7,view:'leadership',sel:{},layer:{}};
const R=k=>rng(hash(S.market+'|'+S.brand+'|'+k));
const scale=()=>MARKETS[S.market]*BRANDS[S.brand];
function series(key,n,start,drift,noise){
 /* trend + seasonality + autocorrelated noise + occasional shocks */
 const r=R(key),amp=noise*3*(.6+r()*.8),ph=r()*6.28,f=n>=12?.52:1.57;let trend=start,walk=0,out=[];
 for(let i=0;i<n;i++){trend*=1+drift;walk=walk*.55+(r()-.5)*noise*3.5;const shock=r()<.1?(r()-.5)*noise*9:0;
  out.push(Math.max(start*.05,trend*(1+amp*Math.sin(i*f+ph)+walk+shock)))}
 return out}
const upto=a=>a.slice(0,S.q+1);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pct=(n,d=0)=>n.toFixed(d)+'%';
function monthsEnding(qi,n){const endM=(qi-0)*3+11;const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const out=[];for(let i=n-1;i>=0;i--){const m=endM-i;const y=2024+Math.floor(m/12);out.push(names[((m%12)+12)%12]+' '+String(y).slice(2))}return out}

/* ---------- KPI catalogue (from the measurement framework) ---------- */
const VIEWS={
 leadership:{nav:'Leadership',group:'Quarterly',title:'Executive KPIs',
  sub:'Four measures for quarterly leadership reporting. Three address commercial and loyalty outcomes; the fourth is a leading indicator of discoverability performance.',
  kpis:['irn','dcc','hon','soa']},
 gsd:{nav:'Global Search & Discoverability',group:'Team views',title:'Global Search & Discoverability',
  sub:'Day-to-day measures for the team setting discoverability strategy, and how each one feeds the leadership view.',kpis:['nlv','sen','ita','ssa']},
 sia:{nav:'Strategy, Insights & Analytics',group:'Team views',title:'Strategy, Insights & Analytics',
  sub:'How much of the journey is observable, and how much weight each modeled figure can carry.',kpis:['ait','irr','mco']},
 oddm:{nav:'Orchestration, Design & Digital Marketing',group:'Team views',title:'Orchestration, Design & Digital Marketing',
  sub:'Whether search insight reaches content in time, and whether property pages are ready for AI-led discovery.',kpis:['itp','ppr','mmr']},
 apac:{nav:'APAC',group:'Team views',title:'APAC',
  sub:'Measured on the AI tools travelers in each market actually use, from Doubao and DeepSeek in China to Naver in Korea, against a competitive set led by marketplaces.',kpis:['mcs','lat','lpc','ilp']},
 emea:{nav:'EMEA',group:'Team views',title:'EMEA',
  sub:'In-language visibility across European and Middle Eastern markets, against other hotel groups and the large online travel agencies.',kpis:['ecs','lpc','ilp']},
 map:{nav:'Semantic page map',group:'Explore',title:'Semantic page map',
  sub:'Every page AI tools cite for travel questions, grouped by meaning. Gaps show where Hilton is absent from the answers.',kpis:[]}
};
const READY={now:'Now',connect:'Connect',scale:'Scale'};
const READY_TIP={now:'Measurable today with current data',connect:'Needs data sources connected',scale:'Needs modeling at scale'};

function kpiData(id){
 const s=scale(),r=R(id+S.q),q=S.q;
 const D={
  irn:()=>{const a=upto(series('irn',8,52000,.07,.06)).map(v=>v*s*3.5);return{kind:'Commercial outcome',name:'Incremental room nights',value:fmt(a[q]),unit:'this quarter',delta:(a[q]/a[q-1]-1)*100,spark:a,ready:'scale',conf:3,
    why:'Estimates additional room nights associated with discoverability activity, rather than attributing all channel bookings.',
    blocks:'Room nights from AI- and organic-originated sessions; matched control pages; referral classification flag; stitched session ID',report:'By market and brand, by business unit, quarter on quarter',feeds:'Revenue impact: ≈ $'+fmt(a[q]*ADR/1e6*10/10)+'M at an average daily rate of $'+ADR+'.'}},

/* ---------- rendering helpers ---------- */
const $=s=>document.querySelector(s);
const charts=[];
function clearCharts(){while(charts.length)charts.pop().destroy()}
function spark(a){const w=200,h=36,min=Math.min(...a),max=Math.max(...a),r=max-min||1;
 const pts=a.map((v,i)=>[(i/(a.length-1))*w,h-4-((v-min)/r)*(h-8)]);
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#022F5F" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="#022F5F"/></svg>`}
function deltaHtml(k){const d=k.delta,good=k.invert?d<0:d>0;const unit=k.pts?' pts':(k.invert?' days':'%');
 return `<span class="delta ${good?'up':'down'}">${d>0?'+':''}${d.toFixed(1)}${unit} vs last quarter</span>`}
function confHtml(n){return `<span class="conf" title="${['','Low','Medium','High'][n]} confidence">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span> ${['','Low','Medium','High'][n]}`}
function tile(id,selected){const k=kpiData(id);
 return `<button class="tile" aria-pressed="${selected}" data-k="${id}">
  <div class="row"><span class="kind">${k.kind}</span><span class="badge ${k.ready}" title="${READY_TIP[k.ready]}">${READY[k.ready]}</span></div>
  <span class="name">${k.name}</span>
  <span class="val">${k.value} <small>${k.unit}</small></span>
  ${deltaHtml(k)}${spark(k.spark)}</button>`}
const baseOpts=(extra={})=>Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
 plugins:{legend:{labels:{font:{family:'Inter',size:12},boxWidth:12,color:'#3A3D42'}},tooltip:{backgroundColor:'#022F5F',titleFont:{family:'Inter'},bodyFont:{family:'Inter'}}},
 scales:{x:{grid:{display:false},ticks:{font:{family:'Inter',size:12},color:'#5C6066'}},y:{grid:{color:'#EDEDEC'},ticks:{font:{family:'Inter',size:12},color:'#5C6066'}}}},extra);
function mk(id,cfg){const c=new Chart(document.getElementById(id),cfg);charts.push(c);return c}

function fmtUnit(v,u){
 if(u==='%')return (v<10?v.toFixed(1):v.toFixed(0))+'%';
 if(u==='count')return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e4?(v/1e3).toFixed(0)+'k':fmt(v);
 if(u==='usd')return '$'+(v/1e6).toFixed(1)+'M';
 if(u==='days'||u==='hours')return v.toFixed(1)+(u==='days'?' days':' hrs');
 if(u==='score')return v.toFixed(0)+'/100';
 if(u==='pos')return v.toFixed(1);
 if(u==='pages')return v.toFixed(1)+' pages';
 if(u==='pts')return (v>0?'+':'')+v.toFixed(1)+' pts';
 return fmt(v)}
function metricRows(v){const s=scale();return METRICS[v].map(([name,layer,u,base,drift,hb,src])=>{
 let a=upto(series('m'+name,8,base,drift,.05));
 if(u==='%')a=a.map(x=>Math.min(x,99));
 if(u==='count'||u==='usd')a=a.map(x=>x*s);
 const q=S.q,val=a[q],prev=a[q-1],tgt=base*Math.pow(1+drift,8)*(u==='count'||u==='usd'?s:1);
 const gap=hb?(val-tgt)/tgt:(tgt-val)/tgt;const st=gap>-.05?'ok':gap>-.15?'risk':'behind';
 const d=u==='%'?val-prev:(val/prev-1)*100;
 return {name,layer,u,src,a,val,prev,tgt:u==='%'?Math.min(tgt,99):tgt,st,d,hb,dUnit:u==='%'?' pts':'%'}})}

 <div><b style="font-family:var(--serif);font-size:24px;color:${p.mentioned?'var(--up)':'var(--down)'}">${p.mentioned?'Yes':'No'}</b><br><span class="layer">Hilton mentioned</span></div></div>
 <div><span class="layer">Cited by</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${p.plats.map(x=>`<span class="ctag" style="background:var(--sky-soft);color:var(--navy)">${x}</span>`).join('')}</div></div>
 <div class="feeds">${p.mentioned?(p.type==='Hilton owned'?'Hilton-owned page that AI tools already cite. Keep it fresh and well structured.':'This page already mentions Hilton. Check the mention is accurate and positive.'):(p.type==='Competitor'?'Competitor page that AI tools cite for this topic. A comparable Hilton page is the response.':'High-value gap: a cited page without Hilton. Target for outreach, partnership content, or a stronger Hilton page on the topic.')}</div>`}

/* ---------- views ---------- */
function leadership(){
 const k={irn:kpiData('irn'),soa:kpiData('soa'),dcc:kpiData('dcc')};
 const r=R('lead'+S.q);const rn=parseInt(k.irn.value.replace(/,/g,''));
 const exp=(r()*6+3).toFixed(1),attrib=Math.round(rn*.18),rev=(attrib*ADR/1e6).toFixed(1);
 const mkt=S.market==='Global'?'globally':'in '+S.market;
 const sel=S.sel.leadership||'irn';
 return `
 <section class="loop" aria-label="This quarter in four steps">
  <div><h3><em>01</em>What changed</h3><p>Incremental room nights ran ${exp}% above expected ${mkt} in ${QUARTERS[S.q]}, outside normal seasonal range.</p></div>
  <div><h3><em>02</em>Likely factors</h3><p>Share of the answer rose ${k.soa.delta.toFixed(1)} pts, led by need-led family and wellness prompts. Paid media and promotions were flat.</p></div>
  <div><h3><em>03</em>Commercial implication</h3><p>≈ ${fmt(attrib)} room nights and $${rev}M revenue linked to the visibility gain. Medium confidence: mix model plus two holdout tests.</p></div>
  <div><h3><em>04</em>Recommended action</h3><p>Extend structured data to the remaining property pages in priority markets. Owner: Orchestration, Design &amp; Digital Marketing. Decision: approve sprint capacity.</p></div>
 </section>
 <div class="tiles" id="tiles">${VIEWS.leadership.kpis.map(id=>tile(id,id===sel)).join('')}</div>
 <div class="grid2">
  <section class="panel"><h2>Share of the answer leads room nights</h2><p class="sub">Monthly, ${S.market}. Movement in AI answers shows up in commercial results about two months later.</p><div class="chart tall"><canvas id="cLead"></canvas></div></section>
  <section class="panel"><h2>What drives incremental room nights</h2><p class="sub">Estimated contribution this quarter. Each team's measures sit behind one of these drivers.</p><div class="chart tall"><canvas id="cDrivers"></canvas></div></section>
 </div>
 ${detailPanel(sel)}
 <section class="panel"><h2>Data readiness</h2><p class="sub">Shown separately from the confidence stated on each figure.</p>
  <div class="legend-ready"><span><span class="badge now">Now</span>${READY_TIP.now}</span><span><span class="badge connect">Connect</span>${READY_TIP.connect}</span><span><span class="badge scale">Scale</span>${READY_TIP.scale}</span></div>
 </section>`}

function teamView(v){const sel=S.sel[v]||VIEWS[v].kpis[0];
 return `<div class="tiles" id="tiles">${VIEWS[v].kpis.map(id=>tile(id,id===sel)).join('')}</div>${detailPanel(sel)}${v==='gsd'?sentimentPanel():''}${scorecard(v)}${toolMatrix(v)}${breakdown(v)}`}

function detailPanel(id){const k=kpiData(id);const body=id==='mco'?mcoTable():`<div class="chart"><canvas id="cDetail"></canvas></div>`;
 return `<section class="panel" style="margin-bottom:16px" aria-live="polite">
  <h2>${DETAIL_TITLE[id]}</h2><p class="sub">${k.why}</p>${body}
  <div class="feeds">${k.feeds}</div>
  <div class="meta"><div><b>Building blocks</b>${k.blocks}</div><div><b>Reporting cuts</b>${k.report}</div><div><b>Readiness and confidence</b><span class="badge ${k.ready}">${READY[k.ready]}</span>&nbsp; ${confHtml(k.conf)}</div></div>
 </section>`}

function render(){
 clearCharts();const v=VIEWS[S.view];
 $('#viewTitle').textContent=v.title;$('#viewSub').textContent=v.sub;
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.view?'page':'false'));
 $('#view').innerHTML=S.view==='leadership'?leadership():S.view==='map'?mapView():teamView(S.view);
 const sel=S.sel[S.view]||v.kpis[0];
 if(S.view==='map')mapInit();
 else if(sel!=='mco')detailChart(sel,'cDetail');
 if(S.view==='gsd')sentimentCharts();
 if(S.view==='leadership'){
  const months=monthsEnding(S.q,18),soa=series('soam',18,18,.02,.03);const s=scale();
  const rn=soa.map((v,i)=>(9000+ (soa[Math.max(0,i-2)])*900+R('n'+i)()*1500)*s);
  mk('cLead',{type:'line',data:{labels:months,datasets:[{label:'Share of the answer (%)',data:soa,borderColor:'#022F5F',tension:.35,yAxisID:'y'},{label:'Incremental room nights',data:rn,borderColor:'#5A9BD5',backgroundColor:'rgba(169,219,255,.35)',fill:true,tension:.35,yAxisID:'y1'}]},
   options:baseOpts({scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:9,font:{family:'Inter',size:12}}},y:{position:'left',ticks:{callback:v=>v+'%'}},y1:{position:'right',grid:{display:false},ticks:{callback:v=>fmt(v)}}}})});
  const tot=parseInt(kpiData('irn').value.replace(/,/g,''));const r=R('drv'+S.q);
  const w=[.30+r()*.08,.24+r()*.08,.18+r()*.06,.10+r()*.05];const sum=w.reduce((a,b)=>a+b);
  const labels=['AI visibility (share of the answer)','Organic search visibility','Branded demand created','App and local visibility'];
  mk('cDrivers',{type:'bar',data:{labels,datasets:[{label:'Room nights',data:w.map(x=>x/sum*tot),backgroundColor:['#022F5F','#2E5C8A','#5A9BD5','#A9DBFF'],borderRadius:6}]},
   options:baseOpts({indexAxis:'y',plugins:{legend:{display:false},tooltip:{backgroundColor:'#022F5F',callbacks:{label:c=>fmt(c.raw)+' room nights'}}},scales:{x:{ticks:{callback:v=>fmt(v)}},y:{grid:{display:false},ticks:{font:{family:'Inter',size:12},color:'#1B1B1B'}}}})});
 }
 if(S.view!=='leadership'&&S.view!=='map'){
  document.querySelectorAll('#chips button').forEach(b=>b.addEventListener('click',()=>{S.layer[S.view]=b.dataset.l;
   document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#scBody').innerHTML=scorecardBody(S.view)}));
  if($('#csv'))$('#csv').addEventListener('click',()=>downloadCSV(S.view));
  $('#scBody').addEventListener('click',e=>{const el=e.target.closest('[data-dd]');if(el)openDeepDive(el.dataset.dd)});
  $('#scBody').addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest('[data-dd]');if(el)openDeepDive(el.dataset.dd)}});
 }
 document.querySelectorAll('#tiles .tile').forEach(t=>t.addEventListener('click',()=>{S.sel[S.view]=t.dataset.k;render();
  document.querySelector(`#tiles .tile[data-k="${t.dataset.k}"]`).focus()}));
}

/* ---------- init ---------- */
(function init(){
 const nav=$('#nav');let lastGroup='';
 Object.entries(VIEWS).forEach(([k,v])=>{if(v.group!==lastGroup){nav.insertAdjacentHTML('beforeend',`<p class="nav-group">${v.group}</p>`);lastGroup=v.group}
  nav.insertAdjacentHTML('beforeend',`<button data-v="${k}">${v.nav}</button>`)});
 nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;render()});
 const fill=(el,opts,val)=>{el.innerHTML=opts.map((o,i)=>`<option value="${typeof val==='number'?i:o}">${o}</option>`).join('');el.value=typeof val==='number'?String(val):val};
 fill($('#fMarket'),Object.keys(MARKETS),S.market);fill($('#fBrand'),Object.keys(BRANDS),S.brand);
 const qs=QUARTERS.slice(3);$('#fQuarter').innerHTML=qs.map((q,i)=>`<option value="${i+3}">${q}</option>`).join('');$('#fQuarter').value='7';
 $('#fMarket').onchange=e=>{S.market=e.target.value;render()};
 $('#fBrand').onchange=e=>{S.brand=e.target.value;render()};
 $('#fQuarter').onchange=e=>{S.q=+e.target.value;render()};
 $('#dd').addEventListener('close',()=>{while(ddCharts.length)ddCharts.pop().destroy()});
 $('#dd').addEventListener('click',e=>{if(e.target.id==='dd')$('#dd').close()});
 render();
 if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{if(d){S.dl=d;render()}}).catch(()=>{})}
})();
</script>
</body>
</html>
